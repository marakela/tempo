<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Программа «Время»</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-image: linear-gradient(165deg, rgb(255, 0, 255), rgb(205, 100, 105), rgb(78, 78, 255));
            height: 100vh;
            color: rgb(245, 245, 245);
        }
        h2 {
            padding-top: 9vh;
        }
        .container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .input-group {
            margin: 10px 25px;
        }
        input, button {
            padding: 4px;
            font-size: 16px;
            width: 130px;
        }
        #result {
            margin-top: 20px;
            font-size: 24px;
        }
        p {
            margin: 6px 0;
        }
    </style>
</head>
<body>
    <h2>Конвертёр дат в дневнике</h2>

    <div class="container">
        <div class="input-group">
            <label for="inputDate">Дата:</label><br>
            <input type="date" id="inputDate"><br><br>
            <button onclick="convertToPage()">Перевести в страницу жизни</button>
        </div>
        <div class="input-group">
            <label for="inputPage">Страница жизни:</label><br>
            <input type="text" id="inputPage"><br><br>
            <button onclick="convertToDate()">Перевести в дату</button>
        </div>
    </div>
    
    <div id="result"></div>

    <script>
        const birthDate = new Date(2003, 3, 28); // 28 апреля 2003
        const vovaCycleStart = new Date(2025, 9, 30); // 30 октября 2025 — 1-й рабочий день
        const cycleLength = 6; // 3 работы + 3 выходных

        function getVovaShiftInfo(targetDate) {
            const diffDays = Math.floor((targetDate - vovaCycleStart) / (1000 * 60 * 60 * 24));
            const offset = ((diffDays % cycleLength) + cycleLength) % cycleLength;
            if (offset < 3) {
                return `К тому же это ${offset + 1}-й рабочий день Вовы.`;
            } else {
                return `К тому же это ${offset - 2}-й выходной день Вовы.`;
            }
        }

        function ensurePeriod(text) {
            // Добавляем точку только если её нет в конце строки
            return text.trim().endsWith('.') ? text.trim() : text.trim() + '.';
        }

        function convertToDate() {
            const input = document.getElementById('inputPage').value.trim();
            const result = document.getElementById('result');

            if (!isNaN(input)) {
                const lifePage = parseInt(input);
                if (lifePage > 0) {
                    const targetDate = new Date(birthDate);
                    targetDate.setDate(targetDate.getDate() + lifePage - 1);
                    const formattedDate = targetDate.toLocaleDateString('ru-RU', {day: 'numeric', month: 'long', year: 'numeric'});
                    const line1 = ensurePeriod('Это ' + formattedDate);
                    const line2 = getVovaShiftInfo(targetDate);
                    result.innerHTML = `<p>${line1}</p><p>${line2}</p>`;
                } else {
                    result.innerHTML = '<p>Ты ошибочно себя повёл.</p>';
                }
            } else {
                result.innerHTML = '<p>Ты ошибочно себя повёл.</p>';
            }
        }

        function convertToPage() {
            const input = document.getElementById('inputDate').value;
            const result = document.getElementById('result');

            if (input) {
                const targetDate = new Date(input);
                if (!isNaN(targetDate.getTime())) {
                    const daysDiff = Math.floor((targetDate - birthDate) / (1000 * 60 * 60 * 24)) + 1;
                    const line1 = ensurePeriod('Это страница жизни №' + daysDiff);
                    const line2 = getVovaShiftInfo(targetDate);
                    result.innerHTML = `<p>${line1}</p><p>${line2}</p>`;
                } else {
                    result.innerHTML = '<p>Ты ошибочно себя повёл.</p>';
                }
            } else {
                result.innerHTML = '<p>Ты ошибочно себя повёл.</p>';
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const now = new Date();
            const moscowOffset = 3 * 60;
            const localOffset = now.getTimezoneOffset();
            const moscowTime = new Date(now.getTime() + (moscowOffset + localOffset) * 60000);
            const today = moscowTime.toISOString().split('T')[0];
            document.getElementById('inputDate').value = today;
        });
    </script>
</body>
</html>
